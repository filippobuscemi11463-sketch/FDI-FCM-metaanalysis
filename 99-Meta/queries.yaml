#             letter[pt] deliberatamente NON escluso.
# 2026-09-20  Q6 allargata al braccio 'ferro EV generico': con i soli nomi
#             commerciali in [tiab] restituiva 1 record.
# 2026-09-23  Q6 aggiunta a no_exclude. Controllo di completezza
