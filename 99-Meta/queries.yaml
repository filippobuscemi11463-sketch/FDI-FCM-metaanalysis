#             review[pt] la escludeva da tutte le 5 query che la intercettano.
#             Costo misurato: Q6 da 8 a 11 record. Togliere review/SR/MA da tutte
#             le query costerebbe 92 record, nessun altro lavoro originale.
# 2026-09-29  Aggiunta la sezione query_meta con M1-rct-head-to-head per la
#             meta-analisi: `finestra: nessuna` (build_term non aggiunge limiti
#             di data) ed exclude_pubtypes propri (solo errata). Le query Q1-Q9
#             sono invariate: stesso term, stessa finestra, stesse esclusioni.
